name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build and Test with Maven (headful mode)
      run: xvfb-run -a mvn clean verify -Dmaven.compiler.showDeprecation=true
